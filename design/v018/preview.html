<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Doorn VST - animation preview</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#16171a;color:#aaa;font:13px system-ui,sans-serif;height:100%}#wrap{display:flex;flex-direction:column;align-items:center;padding:8px}
#stage{position:relative;width:1235px;height:1800px;transform-origin:top center;user-select:none;-webkit-user-select:none;touch-action:none}
#stage img{position:absolute;pointer-events:none}.hit{position:absolute;cursor:pointer}.k{cursor:ns-resize;border-radius:50%}p{margin:4px 0 8px;text-align:center}</style></head>
<body><div id="wrap"><p>Drag knobs up/down (or wheel) &middot; click switches to cycle up/mid/down &middot; left footswitch = boost light, right footswitch = bypass LED</p><div id="stage"></div></div>
<script>
const M={"canvas": {"width": 1235, "height": 1800}, "switches": {"left": {"center": [308.75, 995], "x": 240, "y": 902, "w": 174, "h": 211, "states": {"up": "sprites/switch_left_up.png", "mid": "sprites/switch_left_mid.png", "down": "sprites/switch_left_down.png"}}, "right": {"center": [926.25, 995], "x": 858, "y": 902, "w": 173, "h": 211, "states": {"up": "sprites/switch_right_up.png", "mid": "sprites/switch_right_mid.png", "down": "sprites/switch_right_down.png"}}}, "knobs": {"gain": {"center": [309, 265], "diameter": 190, "sprite_size": 200, "x": 209, "y": 165, "pivot": [100, 100], "layers": ["sprites/knob_center_fixed_190px.png", "sprites/knob_rotating_crown_and_arrow_190px.png", "sprites/knob_reflect_static_190px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}}, "level": {"center": [926, 265], "diameter": 190, "sprite_size": 200, "x": 826, "y": 165, "pivot": [100, 100], "layers": ["sprites/knob_center_fixed_190px.png", "sprites/knob_rotating_crown_and_arrow_190px.png", "sprites/knob_reflect_static_190px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}}, "treble": {"center": [309, 650], "diameter": 190, "sprite_size": 200, "x": 209, "y": 550, "pivot": [100, 100], "layers": ["sprites/knob_center_fixed_190px.png", "sprites/knob_rotating_crown_and_arrow_190px.png", "sprites/knob_reflect_static_190px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}}, "mids": {"center": [618, 650], "diameter": 190, "sprite_size": 200, "x": 518, "y": 550, "pivot": [100, 100], "layers": ["sprites/knob_center_fixed_190px.png", "sprites/knob_rotating_crown_and_arrow_190px.png", "sprites/knob_reflect_static_190px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}}, "bass": {"center": [926, 650], "diameter": 190, "sprite_size": 200, "x": 826, "y": 550, "pivot": [100, 100], "layers": ["sprites/knob_center_fixed_190px.png", "sprites/knob_rotating_crown_and_arrow_190px.png", "sprites/knob_reflect_static_190px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}}, "boost": {"center": [618, 265], "diameter": 100, "sprite_size": 108, "x": 564, "y": 211, "pivot": [54, 54], "off": ["sprites/boost_center_off_100px.png", "sprites/boost_rotating_off_100px.png", "sprites/boost_reflect_static_100px.png"], "on": ["sprites/boost_center_on_100px.png", "sprites/boost_rotating_on_100px.png", "sprites/boost_reflect_static_100px.png"], "layer_roles": ["fixed", "rotating (rotate around pivot)", "static, drawn on top"], "rotation_deg": {"min": -135, "max": 135, "at_value_0.5": 0}, "glow": {"sprite": "sprites/boost_glow_on.png", "size": 280, "x": 478, "y": 125, "note": "draw under the knob, only when boost is ON (boost footswitch)"}}}, "leds": {"bypass": {"center": [618, 1325], "size": 180, "x": 528, "y": 1235, "off": "sprites/led_off.png", "on": "sprites/led_on.png", "note": "on = effect engaged (bypass footswitch)"}}, "footswitches": {"boost": {"center": [355, 1565], "radius": 120, "note": "left; toggles boost knob light"}, "bypass": {"center": [880, 1565], "radius": 120, "note": "right; toggles bottom LED"}}, "screen": {"x": 308.75, "y": 1170.5, "w": 617.5, "h": 65, "corner_radius": 32.5, "arrow_left_center": [343, 1203], "arrow_right_center": [892, 1203], "note": "Background contains the frame + the two arrows; draw the preset name at runtime on top."}, "z_order": ["Doorn_Background.png", "boost glow (if lit)", "knob layers: fixed centre -> rotating crown+arrow -> static reflect", "boost knob layers (same order)", "switch sprite (current state)", "LED sprite"], "switch_state_meaning": {"left": {"up": "label \"off\"", "mid": "centre", "down": "label \"on\""}, "right": {"up": "label \"sdt-2\"", "mid": "label \"laerm\"", "down": "label \"sdt-1\""}}};const st=document.getElementById('stage');let scale=1;
function img(src,x,y,w,h){const i=document.createElement('img');i.src=src;i.style.left=x+'px';i.style.top=y+'px';if(w){i.style.width=w+'px';i.style.height=h+'px'}st.appendChild(i);return i}
img('Doorn_Background.png',0,0,1235,1800);
const state={boost:false,bypass:false,val:{},sw:{left:'down',right:'mid'}};
const bk=M.knobs.boost;const glow=img(bk.glow.sprite,bk.glow.x,bk.glow.y,bk.glow.size,bk.glow.size);glow.style.opacity=0;
const boostImgs=[];
function drag(name,x,y,S,rotImg){state.val[name]=.5;const h=document.createElement('div');h.className='hit k';h.style.cssText+=`left:${x}px;top:${y}px;width:${S}px;height:${S}px`;st.appendChild(h);let y0=null,v0=0;
 const upd=()=>{rotImg.style.transform=`rotate(${(state.val[name]-.5)*270}deg)`};upd();
 h.addEventListener('pointerdown',e=>{y0=e.clientY;v0=state.val[name];h.setPointerCapture(e.pointerId)});
 h.addEventListener('pointermove',e=>{if(y0===null)return;state.val[name]=Math.min(1,Math.max(0,v0+(y0-e.clientY)/200/scale));upd()});
 h.addEventListener('pointerup',()=>y0=null);
 h.addEventListener('wheel',e=>{e.preventDefault();state.val[name]=Math.min(1,Math.max(0,state.val[name]-e.deltaY/2000));upd()},{passive:false})}
for(const [n,k] of Object.entries(M.knobs)){
 if(n==='boost'){const L=k.off;const a=img(L[0],k.x,k.y,k.sprite_size,k.sprite_size),b=img(L[1],k.x,k.y,k.sprite_size,k.sprite_size),c=img(L[2],k.x,k.y,k.sprite_size,k.sprite_size);boostImgs.push(a,b,c);drag(n,k.x,k.y,k.sprite_size,b)}
 else{const L=k.layers;img(L[0],k.x,k.y,200,200);const r=img(L[1],k.x,k.y,200,200);img(L[2],k.x,k.y,200,200);drag(n,k.x,k.y,200,r)}}
for(const side of ['left','right']){const s=M.switches[side];const im=img(s.states[state.sw[side]],s.x,s.y,s.w,s.h);
 const h=document.createElement('div');h.className='hit';h.style.cssText+=`left:${s.center[0]-45}px;top:${s.center[1]-70}px;width:90px;height:140px`;st.appendChild(h);
 h.addEventListener('click',()=>{const o=['up','mid','down'];state.sw[side]=o[(o.indexOf(state.sw[side])+1)%3];im.src=s.states[state.sw[side]]})}
const L=M.leds.bypass;const led=img(L.off,L.x,L.y,L.size,L.size);
function fs(name,fn){const f=M.footswitches[name];const h=document.createElement('div');h.className='hit';h.style.cssText+=`left:${f.center[0]-f.radius}px;top:${f.center[1]-f.radius}px;width:${f.radius*2}px;height:${f.radius*2}px;border-radius:50%`;st.appendChild(h);h.addEventListener('click',fn)}
fs('boost',()=>{state.boost=!state.boost;glow.style.opacity=state.boost?1:0;const s=state.boost?bk.on:bk.off;boostImgs.forEach((im,i)=>im.src=s[i])});
fs('bypass',()=>{state.bypass=!state.bypass;led.src=state.bypass?L.on:L.off});
function fit(){scale=Math.min(1,(innerHeight-60)/1800,innerWidth/1235);st.style.transform=`scale(${scale})`;st.style.marginBottom=(-(1-scale)*1800)+'px'}
addEventListener('resize',fit);fit();
</script></body></html>
